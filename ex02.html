<!DOCTYPE html>
<html>
<style>
#janela {
  position: absolute;
  background-color: #f1f1f1;
  text-align: center;
  border: 1px solid #d3d3d3;
}

.texto {
  padding: 10px;
  cursor: move;
  background-color: #2196F3;
  color: #fff;
}
</style>
<body>

<div id="janela">
  <span class="texto">Clique aqui para mover...</div>
</div>

<script>
var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
var div = document.getElementById("janela");
div.onmousedown=function(e) {
    e = e || window.event;
    e.preventDefault();
    // busca a posicao do mouse
    pos3 = e.clientX;
    pos4 = e.clientY;
    document.onmouseup = function() {
        // para de mover o mouse quando o botao for solto
        document.onmouseup = null;
        document.onmousemove = null;        
    };
    // movimenta a janela:
    document.onmousemove = function(e) {
        e = e || window.event;
        e.preventDefault();
        // calcula a nova posicao do cursor:
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        // seta a nova posicao do elemento:
        div.style.top = (div.offsetTop - pos2) + "px";
        div.style.left = (div.offsetLeft - pos1) + "px";        
    }; 
};
</script>

</body>
</html>
