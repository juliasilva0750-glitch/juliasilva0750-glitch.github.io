<!doctype html>
<html>
  <head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title>Bootstrap!</title>
</head>
<body>
<form method="get" action="bootstrap08_retorno.html">
  <div class="container pt-2">
    <div class="row border" style="width: 50%">
      <div class="col">
        <div class="mb-3 mt-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="txt_email" 
               placeholder="Digite o email" name="txt_email">
        </div>
        <div class="mb-3">
          <label for="pwd" class="form-label">Senha:</label>
          <input type="password" class="form-control" id="pwd_senha" 
                 placeholder="Digite a senha" name="pwd_senha">
        </div>
        <div class="form-check mb-3">
          <label class="form-check-label">
          <input class="form-check-input" type="checkbox" 
                 name="txt_lembrar"> Relembrar
          </label>
        </div>
        <div class="mb-3">
          <button type="submit" class="btn btn-primary">Enviar</button>
        </div>
      </div>
    </div>
  </div>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
